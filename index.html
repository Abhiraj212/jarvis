<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hud">
  <div class="top">JARVIS • STANDBY</div>

  <!-- CAMERA -->
  <video id="camera" autoplay muted></video>

  <!-- CHAT -->
  <div id="chat"></div>

  <!-- INPUT -->
  <div class="input-area">
    <input id="textInput" placeholder="Type here..." />
    <button onclick="sendText()">➤</button>
    <button onclick="wakeJarvis()">⚡</button>
  </div>

  <!-- MEMORY PANEL -->
  <details class="memory">
    <summary>🧠 Memory</summary>
    <pre id="memoryView"></pre>
    <button onclick="clearMemory()">Clear Memory</button>
  </details>
</div>

<script src="jarvis.js"></script>
</body>
</html>
