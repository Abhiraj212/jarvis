name: Build DJ Studio Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DJStudio/AbhirajDJStudio.zip"
    branches: [abhiraj-dj-studio-import]

permissions:
  contents: read

jobs:
  build-dj-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract DJ Studio ZIP
        shell: bash
        run: |
          test -f DJStudio/AbhirajDJStudio.zip || {
            echo "::error::Missing DJStudio/AbhirajDJStudio.zip. Upload the supplied ZIP to this exact path, then run this workflow."
            exit 1
          }
          mkdir -p DJStudio/unpacked
          unzip -q DJStudio/AbhirajDJStudio.zip -d DJStudio/unpacked
          PROJECT_DIR="DJStudio/unpacked/AbhirajDJStudio"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || [[ "${PIPESTATUS[1]}" -eq 0 ]]
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build DJ Studio debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload DJ Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: Abhiraj-DJ-Studio-debug-APK
          path: DJStudio/unpacked/AbhirajDJStudio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
