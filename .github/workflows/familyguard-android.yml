name: Build FamilyGuard Android APKs

on:
  push:
    branches: [familyguard-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || [[ "${PIPESTATUS[1]}" -eq 0 ]]
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Parent and Child APKs
        run: gradle --no-daemon --stacktrace :parent:assembleDebug :child:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyGuard-Android-APKs
          path: |
            parent/build/outputs/apk/debug/*.apk
            child/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
